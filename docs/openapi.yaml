openapi: 3.0.3
info:
  title: TaskFlow API
  description: Multi-tenant project management backend with PostgreSQL, Redis, BullMQ, and RBAC.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local Development Server

paths:
  /health:
    get:
      summary: Health Check
      description: Returns service health status and uptime
      responses:
        '200':
          description: OK

  /auth/register:
    post:
      summary: Register a new user and organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                  example: admin1@acme.com
                password:
                  type: string
                  format: password
                  example: Password123!
                name:
                  type: string
                  example: Alice Johnson
                organizationName:
                  type: string
                  example: Acme Dynamics
      responses:
        '201':
          description: Registration successful
        '409':
          description: User with email already exists

  /auth/login:
    post:
      summary: Authenticate user and issue JWT + Refresh Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin1@acme.com
                password:
                  type: string
                  format: password
                  example: Password123!
                organizationId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /auth/refresh:
    post:
      summary: Rotate and refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Tokens rotated successfully
        '401':
          description: Token expired or compromise detected

  /auth/logout:
    post:
      summary: Revoke refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Logged out successfully

  /auth/me:
    get:
      summary: Get current authenticated user profile and active organization
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
        '401':
          description: Unauthorized

  /projects:
    get:
      summary: List projects for active organization
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Projects list
    post:
      summary: Create new project
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Website Redesign 2026
                description:
                  type: string
                  example: Redesigning corporate web app
      responses:
        '201':
          description: Project created

  /projects/{id}:
    get:
      summary: Get project details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project details
        '403':
          description: Cross-tenant access forbidden
        '404':
          description: Project not found
    patch:
      summary: Update project details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Project updated
    delete:
      summary: Soft-delete project (org_admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project deleted

  /projects/{id}/dashboard:
    get:
      summary: Get project dashboard and task status metrics
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dashboard metrics

  /tasks:
    get:
      summary: List tasks with filters, pagination, and Full-Text Search
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [todo, in_progress, review, done]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, urgent]
        - name: assignee
          in: query
          schema:
            type: string
            format: uuid
        - name: due_from
          in: query
          schema:
            type: string
            format: date-time
        - name: due_to
          in: query
          schema:
            type: string
            format: date-time
        - name: q
          in: query
          description: Full-Text Search on title and description
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: paginationType
          in: query
          schema:
            type: string
            enum: [offset, cursor]
            default: offset
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Tasks list
    post:
      summary: Create new task
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, title]
              properties:
                projectId:
                  type: string
                  format: uuid
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [todo, in_progress, review, done]
                priority:
                  type: string
                  enum: [low, medium, high, urgent]
                dueDate:
                  type: string
                  format: date-time
                assigneeIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '201':
          description: Task created

  /tasks/{id}:
    get:
      summary: Get task details with assignments and comments
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task details
        '403':
          description: Cross-tenant access forbidden
        '404':
          description: Task not found
    patch:
      summary: Update task details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [todo, in_progress, review, done]
                priority:
                  type: string
                  enum: [low, medium, high, urgent]
                dueDate:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Task updated
    delete:
      summary: Soft-delete task
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task deleted

  /tasks/bulk-status:
    patch:
      summary: Bulk update status of multiple tasks atomically
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskIds, status]
              properties:
                taskIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                status:
                  type: string
                  enum: [todo, in_progress, review, done]
      responses:
        '200':
          description: Tasks updated successfully

  /tasks/{id}/assign:
    post:
      summary: Assign user to task (triggers asynchronous BullMQ email notification)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: User assigned and email job enqueued
        '403':
          description: User belongs to a different organization

  /tasks/{id}/unassign:
    post:
      summary: Unassign user from task
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: User unassigned

  /tasks/{taskId}/comments:
    get:
      summary: List comments for task
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Comments list
    post:
      summary: Add comment to task
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        '201':
          description: Comment created

  /jobs/{id}:
    get:
      summary: Check BullMQ background job processing status
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status (pending, active, completed, failed)
        '404':
          description: Job not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
